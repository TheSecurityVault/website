baseURL: https://thesecurityvault.com
languageCode: en-us
title: The Security Vault
theme: "6.0"
copyright: Copyright 2019-{year} The Security Vault. All rights reserved.
enableRobotsTXT: true
postsFolder: posts
params:
  author: Luis Fontes
  background: c2
  bgSwitcher: true
  bootSequence: false
  intro: true
  images:
    - /banner.png
  description: Because Security Matters - Demystifying those weird and dark
    security vulnerabilities nobody talks about
  mainSections:
    - post
  logo: /img/logo.png
  ads_title: My Projects
  social_title: Social
  author_on_posts: false
taxonomies:
  category: category
  tag: tag
permalinks:
  posts: /:title
  categories: /:slug/
urlRewrite:
  /category/(.*?)/(.*): /$1/$2
pagination:
  pagerSize: 9
outputs:
  home:
    - RSS
    - HTML
outputFormats:
  RSS:
    mediatype: application/rss
    baseName: feed
markup:
  highlight:
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    lineAnchors: ""
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: true
    style: dracula
    tabWidth: 4
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: aboutme
      name: About me
      url: /about/
      weight: 30
  social:
    - identifier: linkedin
      name: LinkedIn
      url: https://pt.linkedin.com/in/luisfontes19
    - identifier: github
      name: GitHub
      url: https://github.com/luisfontes19
    - identifier: rss
      name: Rss
      url: https://thesecurityvault.com/feed
