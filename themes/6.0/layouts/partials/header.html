<div class="vault-unlocked" id="vaultUnlocked" role="dialog" aria-modal="true" aria-label="Challenge complete">
  <div class="vault-unlocked-inner">
    <div class="vault-unlocked-bar" aria-hidden="true">
      <span class="dot dot--r"></span><span class="dot dot--y"></span><span class="dot dot--g"></span>
      <span class="vault-unlocked-title">root@vault: ~</span>
    </div>
    <div class="vault-unlocked-body" id="vaultUnlockedBody"></div>
    <button class="vault-unlocked-close" id="vaultUnlockedClose" aria-label="Close">[ esc ] close</button>
  </div>
</div>

<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-overlay-inner">
    <div class="search-overlay-bar">
      <span class="search-overlay-prompt">grep -ri</span>
      <input type="search" id="search" class="search-overlay-input" placeholder="pattern..." autocomplete="off">
      <button class="search-overlay-close" id="searchClose" aria-label="Close search">esc</button>
    </div>
    <div id="search-results" class="search-overlay-results"></div>
  </div>
</div>
