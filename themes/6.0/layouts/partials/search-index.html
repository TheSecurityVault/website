<script>
  window.searchIndex = {
  {{- range site.RegularPages }}
  "{{ .Permalink }}": {
    "title": "{{ .Title }}",
      "tags": [{{ range .Params.Tags }} "{{ . }}", {{ end }}],
  "content": "{{ .Content | plainify }}",
    "url": "{{ .Permalink }}",
      "summary": "{{ .Summary | plainify | truncate 200 }}",
        "preview": "{{ .Permalink }}{{ .Params.preview }}"
  },
  {{- end }}
};
</script>
