<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default " en" }}" data-page="{{ if .IsHome }}home{{ else }}inner{{ end }}">

<head>
  {{- partial "head.html" . -}}
</head>

<body>
  {{/* ── CRT / scanline / vignette overlay (pure CSS, non-interactive) ── */}}
  <div class="crt" aria-hidden="true">
    <div class="crt-scanlines"></div>
    <div class="crt-flicker"></div>
    <div class="crt-vignette"></div>
  </div>

  {{- partial "header.html" . -}}

  <main id="content">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}
</body>

</html>
