{{ partial "search-index.html" . }}

<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <a href="/" class="nav-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>{{ .Site.Title }}</span>
      </a>
      <p class="footer-tagline">{{ .Site.Params.description }}</p>
    </div>

    <div class="footer-links">
      <div class="footer-col">
        <h4 class="footer-col-title">Navigate</h4>
        <a href="/" class="footer-link">Home</a>
        <a href="/#about" class="footer-link">About</a>
        <a href="/#projects" class="footer-link">Projects</a>
        <a href="/posts/" class="footer-link">Blog</a>
      </div>
      <div class="footer-col">
        <h4 class="footer-col-title">Connect</h4>
        {{ range .Site.Menus.social }}
        <a href="{{ .URL }}" class="footer-link" target="_blank" rel="noopener noreferrer">{{ .Name }}</a>
        {{ end }}
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container">
      <span>{{ replace .Site.Copyright "{year}" now.Year }}</span>
      <div class="footer-bottom-links">
        <a href="/sitemap.xml">Sitemap</a>
        <a href="/feed">RSS</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://unpkg.com/lunr@2.3.9/lunr.js"
  integrity="sha384-Mrc0XsDxndfJgV5jLnEeThch4j9dNEXAE1vbWeyzmERxSvF8siQfuEczzgUelQQH" crossorigin="anonymous"></script>
<script src="/js/search.js"></script>

<script>
  // Open external links in new tab
  document.querySelectorAll('a[href]').forEach(function (a) {
    const href = a.getAttribute('href');
    if (href && href.startsWith('http') && !href.startsWith(window.location.origin)) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    }
  });

  // Anchor link icons for headings in prose
  document.querySelectorAll('.prose h2, .prose h3, .prose h4').forEach(function (h) {
    if (!h.id) return;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'heading-anchor';
    a.setAttribute('aria-hidden', 'true');
    a.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';
    h.appendChild(a);
  });
</script>
