<header class="nav" id="navbar">
  <div class="container nav-inner">
    <a href="/" class="nav-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>{{ .Site.Title }}</span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-menu" id="navMenu" role="navigation">
      <a href="/#about" class="nav-link">About</a>
      <a href="/#projects" class="nav-link">Projects</a>
      <a href="/posts/" class="nav-link">Blog</a>
      <button class="nav-search-btn" id="searchOpen" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </nav>
  </div>
</header>

<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-overlay-inner">
    <div class="search-overlay-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="search" class="search-overlay-input" placeholder="Search articles..." autocomplete="off">
      <button class="search-overlay-close" id="searchClose" aria-label="Close search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="search-results" class="search-overlay-results"></div>
  </div>
</div>

<script>
  (function () {
    const navbar = document.getElementById('navbar');
    const toggle = document.getElementById('navToggle');
    const menu = document.getElementById('navMenu');
    const searchOpen = document.getElementById('searchOpen');
    const searchOverlay = document.getElementById('searchOverlay');
    const searchClose = document.getElementById('searchClose');
    const searchInput = document.getElementById('search');

    // Sticky shadow on scroll
    window.addEventListener('scroll', function () {
      navbar.classList.toggle('nav--scrolled', window.scrollY > 10);
    }, { passive: true });

    // Mobile toggle
    toggle.addEventListener('click', function () {
      const open = menu.classList.toggle('nav-menu--open');
      toggle.setAttribute('aria-expanded', String(open));
    });

    // Close menu on link click (mobile)
    menu.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        menu.classList.remove('nav-menu--open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });

    // Search overlay
    function openSearch() {
      searchOverlay.classList.add('search-overlay--open');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { searchInput.focus(); }, 100);
    }
    function closeSearch() {
      searchOverlay.classList.remove('search-overlay--open');
      document.body.style.overflow = '';
    }

    searchOpen.addEventListener('click', openSearch);
    searchClose.addEventListener('click', closeSearch);
    searchOverlay.addEventListener('click', function (e) {
      if (e.target === searchOverlay) closeSearch();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSearch();
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
    });
  })();
</script>
